# The Nintendo Switch build's own composition (src/platform/switch; mods/SPEC.md, M23).
# The Switch Makefile reads this file in place of mods.cfg.
-archipelago   # its TLS loads the system's OpenSSL at run time; a Switch has none (and libnx has no sigaction)
-netplay       # the port has no socketInitializeDefault(); a socket would never open
