# The shipped composition: which mods a plain build carries.
# Change your own build with a mods.cfg at the top of the tree (it is not committed):
#   +hd3d          switch a mod on
#   -archipelago   switch a mod off
#   hd2d off       the same, in words
# The mods and what they do: mods/catalog.tsv, or run  python3 tools/mods.py show
story       on
screenshot  on
hd2d        on
hd3d        on
randomizer  on
archipelago on
netplay     on
helpbook    off   # new on the recipe branch: switch on with +helpbook
