[General]
# Automatically save state on quit and reload on start
Autosave = 0
DisplayPerfInTitle = 0

# Extended aspect ratio, either 16:9, 16:10, or 18:9. 4:3 means normal aspect ratio.
# Add ", unchanged_sprites" to avoid changing sprite spawn/die behavior. Without this
# replays will be incompatible.
# Add ", no_visual_fixes" to avoid fixing some graphics glitches (for example with Cape).
# It won't affect replays/game behavior but the memory compare will not work.
# Add "extend_y, " right before the aspect radio specifier to display 240 lines instead of 224.
ExtendedAspectRatio = 4:3

# Disable the SDL_Delay that happens each frame (Gives slightly better perf if your
# display is set to exactly 60hz)
DisableFrameDelay = 0

# Set which language to use. Note. In order to use other languages you need to create
# the assets file appropriately.
# python restool.py --extract-dialogue -r german.sfc
# python restool.py --languages=de
# Language = de

[Graphics]
# Window size ( Auto or WidthxHeight )
WindowSize = Auto

# Fullscreen mode (0=windowed, 1=desktop fullscreen, 2=fullscreen w/mode change)
Fullscreen = 0

# Window scale (1=100%, 2=200%, 3=300%, etc.)
WindowScale = 3

# Use an optimized (but potentially more buggy) SNES PPU implementation
NewRenderer = 1

# Display the world map with higher resolution
EnhancedMode7 = 1

# Don't keep the aspect ratio
IgnoreAspectRatio = 0

# Enable this option to remove the sprite limits per scan line
NoSpriteLimits = 1

# 2D-HD look: a tilt-shift depth of field (in focus around the players, out
# of focus above and below; sprites and the HUD stay sharp), hazy far layers,
# lighting (the Lamp, torches and fire light the dark rooms), bloom, color grading and a vignette. Strengths go
# from 0 to 100.
Hd2d = 0
Hd2dDepthOfField = 60
Hd2dBloom = 40
Hd2dVignette = 45
Hd2dGrade = 50
Hd2dLighting = 70
# Show a Link hidden behind a roof, bridge or door frame through it (0: hidden
# as in the original).
Hd2dSeeThrough = 0

# 3D view (beta): the world as a little diorama built from the game's own
# tiles, with a camera you can turn and a first-person view. 1 turns it on and
# 0 shows the original picture (F11 switches it for a while without saving).
# It works with or without the 2D-HD look. It only changes the picture, and
# with a turned camera which way the d-pad walks. In the game: the right stick
# or a right mouse drag turns the camera, and a left click or L3 (the View
# button, see Pause menu > Controls) switches to first person. Hd3d is player
# 1's choice; every player picks their own in the pause menu (Video and HD
# options > 3D view), online on their own computer, on the couch with their
# own controller.
Hd3d = 0
# The 3D view for couch players 2, 3 and 4: 0, 1, or same (as Hd3d).
Hd3dCouch = same, same, same
# 1: two seconds after you let go of the camera it goes back to the classic
# view. 0: it stays where you turned it.
Hd3dCameraReturns = 0
# 1: with a turned camera, up on the d-pad walks the way the camera looks (in
# first person it always does). 0: the d-pad works as in the original.
Hd3dTurnControls = 1
# 1: in first person the mouse turns the view (the cursor is captured). 0: the
# mouse turns it only while the right button is held.
Hd3dMouseLook = 1
# 1: with a turned camera, scenery between the camera and your Link is faded
# so you can see him. 0: it hides him (his outline still shows through).
Hd3dFadeScenery = 1
# How fast the right stick turns the camera, in percent (25 to 200).
Hd3dStickSpeed = 100
# How fast the mouse turns the camera (0 to 100).
Hd3dMouseSpeed = 50
# 1: pushing the stick or the mouse up looks down. 0: up looks up.
Hd3dInvertY = 0
# The first-person field of view from top to bottom, in degrees (50 to 90).
Hd3dFov = 65
# How strong the perspective of the third-person view is (0: nearly flat, 100:
# strong).
Hd3dPerspective = 50

# Change the appearance of Link by loading a ZSPR file
# See all sprites here: https://snesrev.github.io/sprites-gfx/snes/zelda3/link/
# Download the files with "git clone https://github.com/snesrev/sprites-gfx.git"
# LinkGraphics = sprites-gfx/snes/zelda3/link/sheets/megaman-x.2.zspr

# Use either SDL, SDL-Software, OpenGL, or OpenGL ES as the output method
# SDL-Software rendering might give better performance on Raspberry pi.
OutputMethod = SDL

# Set to true to use linear filtering. Gives less crisp pixels. Works with SDL and OpenGL.
LinearFiltering = 0

# Set a glsl shader. Only supported with the OpenGL output method
# This can be the path to a .glsl or .glslp file
# Get them with: git clone https://github.com/snesrev/glsl-shaders
Shader =

# Recreate the behavior of the Virtual Console releases, where flashing effects are lessened
DimFlashes = 0

[Sound]
EnableAudio = 1

# The volumes in percent (Pause menu > Sound sets them too): everything,
# the music (the game's and an MSU track), and the sound effects (every
# couch player's). Shift+= and Shift+- change the master volume in the game.
MasterVolume = 100
MusicVolume = 100
SfxVolume = 100

# DSP frequency in samples per second (e.g. 48000, 44100, 32000, 22050, 11025)
AudioFreq = 44100

# number of separate sound channels (1=mono, 2=stereo)
AudioChannels = 2

# Audio buffer size in samples (power of 2; e.g., 4096, 2048, 1024) [try 1024 if sound is crackly]. The higher the more lag before you hear sounds.
AudioSamples = 512

# Enable MSU support for audio. Supports MSU or MSU Deluxe in PCM or OPUZ format.
# OPUZ is around 10% of the size compared to PCM.
# PCM MSU requires AudioFreq = 44100 to work properly while OPUZ needs 48000.
# The following values are accepted: false, true, deluxe, opuz, deluxe-opuz
EnableMSU = false

# The path to the MSU files. The number and the file extension are appended automatically.
MSUPath = msu/alttp_msu-

# Remember MSU position and return back to the same position when entering
# an overworld area. (Only remembers one area)
ResumeMSU = 1

# Change the volume of the MSU playback, a value between 0-100
MSUVolume = 100%

[Features]
# Item switch on L/R. Also allows reordering of items in inventory by pressing Y+direction.
# Hold X, L, or R inside of the item selection screen to assign items to those buttons.
# If X is reassigned, Select opens the map. Push Select while paused to save or quit.
# When L or R are assigned items, those buttons will no longer cycle items.
ItemSwitchLR = 0

# Enable this to limit the ItemSwitchLR item cycling to the first 4 items.
ItemSwitchLRLimit = 0

# Allow turning while dashing
TurnWhileDashing = 0

# Allow mirror to be used to warp to the Dark World
MirrorToDarkworld = 0

# Collect items (like hearts) with sword instead of having to touch them
CollectItemsWithSword = 0

# Level 2-4 sword can be used to break pots
BreakPotsWithSword = 0

# Disable the low health beep
DisableLowHealthBeep = 0

# Avoid waiting too much at the start
SkipIntroOnKeypress = 0

# Display max rupees/bombs/arrows with orange/yellow color
ShowMaxItemsInYellow = 0

# Allows up to four bombs active at a time instead of two.
MoreActiveBombs = 0

# Can carry 9999 rupees instead of 999
CarryMoreRupees = 0

# Enable various zelda bug fixes
MiscBugFixes = 0

# Enable some more advanced zelda bugfixes that change game behavior
GameChangingBugFixes = 0

# Allow bird travel to be cancelled by hitting the X key
CancelBirdTravel = 0

# The opening legend after the title screen tells the Four Swords story: four
# heroes born from one blade, set in the world of A Link to the Past.
# (Online, the host's setting is used.)
FourSwordsStory = 1

# Show "Four Swords of the Past" on the title screen.
FourSwordsTitle = 1

# Randomized and Archipelago files: closing the map (the map button, X)
# shows the check tracker (found / reachable / locked checks by area) until
# the map button is pressed again.
TrackerAfterMap = 1

# Item randomizer for new save files: off, random (a new seed for every new
# file), or seed:XXXXXXXX to play a seed again (shown in Pause menu > Gameplay).
# Chest contents are shuffled; keys, maps and compasses stay in their dungeons.
# A randomized file skips the intro and the castle escape: Link can go anywhere
# from the start, and his uncle in the secret passage gives two random items.
Randomizer = off

# For testing: new save files start with every item at its best (golden sword,
# mirror shield, red mail, 20 hearts, four bottles, the most bombs, arrows and
# rupees). Like a randomized file, such a file skips the intro and the castle
# escape. Items found later never take an item down a level.
# (Online, the host's setting is used.)
FullInventory = 0


[Multiplayer]
# Up to 4 players: couch co-op (each extra controller presses START to drop in)
# and online / LAN play from the in-game menu (Esc, controller Guide, or Back+Start).
# Settings changed in the menu are saved to zelda3.coop.ini, which overrides this file.

# Players can hurt each other with swords, arrows, rods, bombs and boomerangs.
# (The hookshot latches onto a teammate and pulls its owner over instead.)
FriendlyFire = 0

# Online only: your button presses take effect this many frames (1/60 s) later.
# A small delay means every computer learns everyone's buttons sooner, so other
# players' Links have to be corrected less often. 0 to 8, 2 is a good balance.
InputDelay = 2

# A small P1-P4 tag over each Link, in the player's color.
NameTags = 0

# "Watch everyone": every joined player's world gets a pane (2x2 for three or
# four worlds), online players' too. Ctrl+F11 switches it. Only the picture changes.
WatchEveryone = 0

# Couch co-op sound: the music plays from player 1's place (the first local
# player's world), and with this on, the sound effects of every local player's
# world are heard too (a sword swung or a chest opened by player 2 in another
# dungeon). Each other world gets a sound chip of its own with its music
# silenced, so nothing plays twice. Online, each computer hears its own
# players this way. Only the sound changes.
CoopSoundEffects = 1

# Ping markers need no setting: tap the Ping button (keyboard Q for player 1,
# right stick click on a controller; change it in the menu's Controls) to mark
# "look here" in front of your Link, or hold it to call for help.
# (A Controls line above that puts Q on another button takes Q off Ping.)
# R3 pings even while you turn the 3D camera; move Ping in Pause menu >
# Controls if that gets in the way.

# Player colors told apart with any kind of color blindness (bluish green,
# orange, blue, reddish purple) instead of green, red, blue, purple.
ColorBlindColors = 0

# Ask the router to open the port automatically when hosting (UPnP).
UseUpnp = 1

# UDP port used when hosting. Forward it on your router if UPnP doesn't work.
# (A game on another port still shows up in "Find LAN games": the host also
# listens for that on 47474.)
Port = 47474

# Name shown to other players in the LAN game list and the player list
# (Pause menu > Multiplayer > Player name sets it too, typed or picked a
# letter at a time with a controller). A player who restarts their game gets
# their seat back by this name.
PlayerName = Link

# When the router won't open the port (no UPnP), this STUN server tells the
# game your public address, so the room code still works once you forward
# the port by hand. Leave empty to never ask.
StunServer = stun.l.google.com:19302

# Pre-filled room code or address in "Join by code or address".
LastJoinAddress =

# A random id this install sends when joining, so a player the host removed
# stays removed after a restart or a new name. Made on first run and kept in
# zelda3.coop.ini; "off" sends none, and a host that bans by it won't let you
# in. It says nothing about you or your computer: it is sixteen random digits.
InstallId =

# As a host: keep removed install ids out, and don't admit a player who sends
# none. Set to 0 to fall back to removing by name and address only.
BanByInstallId = 1

[Archipelago]
# Archipelago multiworld (archipelago.gg; see the README): the room to
# connect to from Multiplayer > Archipelago. Server is the address the room
# page shows, like archipelago.gg:38281 (ws:// or wss:// in front to choose;
# without, ws:// then wss:// are tried, and archipelago.gg gets wss:// only).
# Slot is your slot name from your YAML (capitals count).
Server =
Slot =
# The room's password, if it has one. The menu never writes this file: it
# keeps Server, Slot and DeathLink in zelda3.coop.ini (which overrides the
# lines here) and never saves the password, so put it here to have it
# remembered.
# Password =
# auto: as your YAML's death_link says. on / off: this game decides. (The
# A Link to the Past world doesn't tell the game: there, auto means off.)
DeathLink = auto
# The Archipelago world to connect as (Multiplayer > Archipelago > World):
# alttp, Archipelago's own "A Link to the Past" world (the default, nothing
# to install), or fsotp, this game's "Four Swords of the Past" world
# (fsotp.apworld; fewer locations). A save file keeps the world it was
# made with.
World = alttp


[KeyMap]
# Change what keyboard keys map to the joypad
# Order: Up, Down, Left, Right, Select, Start, A, B, X, Y, L, R

# This default is suitable for QWERTY keyboards.
Controls = Up, Down, Left, Right, Right Shift, Return, x, z, s, a, c, v

# This default is suitable for QWERTZ keyboards.
#Controls = Up, Down, Left, Right, Right Shift, Return, x, y, s, a, c, v

# This one is suitable for AZERTY keyboards.
#Controls = Up, Down, Left, Right, Right Shift, Return, x, w, s, q, c, v

CheatLife = w
CheatKeys = o
CheatWalkThroughWalls = Ctrl+e
ClearKeyLog = k
StopReplay = l
Fullscreen = Alt+Return
Reset = Ctrl+r
Pause = Shift+p
PauseDimmed = p
Turbo = Tab
ReplayTurbo = t
WindowBigger = Ctrl+Up
WindowSmaller = Ctrl+Down

VolumeUp = Shift+=
VolumeDown = Shift+-

# The 3D view: View3d switches it on or off for a while (not saved). The next
# four turn the camera left and right and tilt it up and down while held.
# View3dReset takes it back to the classic view.
View3d = F11
View3dTurnLeft = Delete
View3dTurnRight = PageDown
View3dTiltUp = Home
View3dTiltDown = End
View3dReset = PageUp

# Screenshot saves a PNG of what is on screen into the screenshots folder
# next to the game; ScreenshotClean the same picture without the menus,
# name tags and other things the mod draws over the game (its HUD stays).
Screenshot = F12
ScreenshotClean = Ctrl+F12
# "Watch everyone": every joined player's world on screen at once (also in
# the Multiplayer menu). Display only, so it works online too.
WatchEveryone = Ctrl+F11
# Help opens the player's manual at the page for what you are doing (the menu,
# the title screen, playing online or together, a dungeon, outdoors). Only in a
# build with the helpbook mod (mods.cfg: +helpbook); elsewhere it does nothing.
Help = Ctrl+H

Load =      F1,     F2,     F3,     F4,     F5,     F6,     F7,     F8,     F9,     F10
Save = Shift+F1,Shift+F2,Shift+F3,Shift+F4,Shift+F5,Shift+F6,Shift+F7,Shift+F8,Shift+F9,Shift+F10
Replay= Ctrl+F1,Ctrl+F2,Ctrl+F3,Ctrl+F4,Ctrl+F5,Ctrl+F6,Ctrl+F7,Ctrl+F8,Ctrl+F9,Ctrl+F10

# Uncomment this to allow loading of reference saves
#LoadRef = 1,2,3,4,5,6,7,8,9,0,-,=,Backspace
#ReplayRef = Ctrl+1,Ctrl+2,Ctrl+3,Ctrl+4,Ctrl+5,Ctrl+6,Ctrl+7,Ctrl+8,Ctrl+9,Ctrl+0,Ctrl+-,Ctrl+=,Ctrl+Backspace

[GamepadMap]
# Any keys used in KeyMap can be used also in this section.
# The shoulder button is called L1/Lb and L2, and the thumbstick button is called L3
Controls = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
