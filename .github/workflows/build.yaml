name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-unix:
    name: on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          os: ubuntu-latest
          artifact: zelda3-linux
        - name: Mac
          os: macos-latest
          artifact: zelda3-macos
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies for Linux
      if: ${{ matrix.name == 'Linux' }}
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev
    - name: Install dependencies for Mac
      if: ${{ matrix.name == 'Mac' }}
      run: |
        brew install sdl2 coreutils
    - name: Build
      run: make -j$(nproc) zelda3
    - name: 3D view unit tests (no ROM)
      run: |
        cc -O2 -Werror tests/unit/r3d_test.c src/r3d.c -lm -o r3d_test
        ./r3d_test
        cc -O2 -Werror tests/unit/cam3d_test.c src/cam3d.c src/r3d.c -lm -o cam3d_test
        ./cam3d_test
    - name: Package
      run: |
        mkdir -p dist/other
        cp zelda3 zelda3.ini README.md MULTIPLAYER.md AI_DISCLOSURE.txt dist/
        cp "archipelago/Four Swords of the Past.yaml" dist/
        python3 archipelago/build_apworld.py dist/fsotp.apworld
        cp other/3x5_font.png dist/other/
        git ls-files assets | tar -cf - -T - | tar -xf - -C dist
        tar -czf ${{ matrix.artifact }}.tar.gz -C dist .
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}-${{ github.sha }}
        path: ${{ matrix.artifact }}.tar.gz
        if-no-files-found: error

  build-windows:
    name: on Windows (MinGW cross build)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install MinGW
      run: |
        sudo apt update
        sudo apt install -y gcc-mingw-w64-x86-64
    - name: Build
      run: tools/build_windows_mingw.sh
    - name: 3D view unit tests compile (no ROM)
      run: |
        x86_64-w64-mingw32-gcc -O2 -Werror tests/unit/r3d_test.c src/r3d.c -o build-windows/r3d_test.exe
        x86_64-w64-mingw32-gcc -O2 -Werror tests/unit/cam3d_test.c src/cam3d.c src/r3d.c -o build-windows/cam3d_test.exe
    - name: Add the Archipelago world
      run: python3 archipelago/build_apworld.py build-windows/dist/fsotp.apworld
    - uses: actions/upload-artifact@v4
      with:
        name: zelda3-windows-${{ github.sha }}
        path: build-windows/dist/
        if-no-files-found: error

  archipelago:
    name: Archipelago client
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev
        python3 -m pip install websockets==13.1
    - name: Client against the mock server
      run: archipelago/tests/run_client_tests.sh
    - name: The APWorld packs
      run: python3 archipelago/build_apworld.py /tmp/fsotp.apworld
