name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-unix:
    name: on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          os: ubuntu-latest
          artifact: zelda3-linux
        - name: Mac
          os: macos-latest
          artifact: zelda3-macos
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies for Linux
      if: ${{ matrix.name == 'Linux' }}
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev
    - name: Install dependencies for Mac
      if: ${{ matrix.name == 'Mac' }}
      run: |
        brew install coreutils cmake
    - name: Build SDL2 into the Mac build
      # Homebrew's SDL2 is a dynamic library the player would have to install
      # (and it needs a current macOS). Build SDL2 from source instead, as a
      # static library for Intel and Apple Silicon on macOS 11 and later.
      if: ${{ matrix.name == 'Mac' }}
      run: |
        curl -sSL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
        tar xzf sdl2.tar.gz
        cmake -S SDL2-2.32.10 -B sdl2-build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
          -DSDL_TEST=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_INSTALL_PREFIX="$PWD/sdl2"
        cmake --build sdl2-build -j$(nproc)
        cmake --install sdl2-build
    - name: Build
      if: ${{ matrix.name == 'Linux' }}
      run: make -j$(nproc) zelda3
    - name: Build (Mac, one binary for Intel and Apple Silicon)
      if: ${{ matrix.name == 'Mac' }}
      run: |
        export PATH="$PWD/sdl2/bin:$PATH"
        static="$(sdl2-config --static-libs)"
        for arch in arm64 x86_64; do
          make clean_obj
          CFLAGS="-O2 -Werror -arch $arch -mmacosx-version-min=11.0" LDFLAGS="-arch $arch -mmacosx-version-min=11.0" \
            make -j$(nproc) zelda3 SDLFLAGS="$static"
          mv zelda3 zelda3.$arch
        done
        lipo -create zelda3.arm64 zelda3.x86_64 -output zelda3
        codesign --force -s - zelda3
        otool -L zelda3
        lipo -info zelda3
    - name: The recipe's own check (no ROM; RECIPE.org, "How to read it")
      if: ${{ matrix.name == 'Linux' }}
      run: |
        awk -f tools/unfold.awk RECIPE.org > recipe-check.sh
        python3 tools/unfold.py RECIPE.org | cmp - recipe-check.sh
        sh -e recipe-check.sh
    - name: The recipe check, proved (a broken tree must not pass)
      if: ${{ matrix.name == 'Linux' }}
      run: sh tests/recipe/run.sh
    - name: A build with every mod off but the help key (the stand-ins and the off branches compile)
      if: ${{ matrix.name == 'Linux' }}
      run: |
        printf -- '-story -screenshot -hd2d -hd3d -randomizer -archipelago -netplay +helpbook\n' > mods.cfg
        make -j$(nproc) zelda3
        ./zelda3 --mods
        rm mods.cfg && make -j$(nproc) zelda3
    - name: The help key's file:// URLs (no ROM)
      if: ${{ matrix.name == 'Linux' }}
      run: |
        cc -O2 -Werror -DZELDA3_MODS_H_ -DMOD_HELPBOOK=1 tests/unit/helpbook_url_test.c src/helpbook_os.c $(sdl2-config --cflags) -o helpbook_url_test
        ./helpbook_url_test
    - name: The two books (Windows help and web pages)
      if: ${{ matrix.name == 'Linux' }}
      run: |
        sudo apt install -y pandoc fp-utils
        python3 tools/books.py build
    - name: 3D view unit tests (no ROM)
      run: |
        cc -O2 -Werror tests/unit/r3d_test.c src/r3d.c -lm -o r3d_test
        ./r3d_test
        cc -O2 -Werror tests/unit/cam3d_test.c src/cam3d.c src/r3d.c -lm -o cam3d_test
        ./cam3d_test
    - name: Package
      run: |
        mkdir -p dist/other
        cp zelda3 zelda3.ini README.md MULTIPLAYER.md AI_DISCLOSURE.txt requirements.txt extract_assets.command dist/
        cp "archipelago/Four Swords of the Past.yaml" dist/
        python3 archipelago/build_apworld.py dist/fsotp.apworld
        cp other/3x5_font.png dist/other/
        git ls-files assets | tar -cf - -T - | tar -xf - -C dist
        if [ -d help ]; then cp -r help dist/; fi
        tar -czf ${{ matrix.artifact }}.tar.gz -C dist .
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}-${{ github.sha }}
        path: ${{ matrix.artifact }}.tar.gz
        if-no-files-found: error

  build-windows:
    name: on Windows (MinGW cross build)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install MinGW
      run: |
        sudo apt update
        sudo apt install -y gcc-mingw-w64-x86-64
    - name: The two books (the build copies help/ into the Windows folder)
      run: |
        sudo apt install -y pandoc fp-utils
        python3 tools/books.py build
    - name: Build
      run: tools/build_windows_mingw.sh
    - name: The help key's Windows file compiles (no ROM)
      run: |
        SDL=build-windows/SDL2-2.28.2/x86_64-w64-mingw32
        x86_64-w64-mingw32-gcc -O2 -Werror -fsyntax-only -DZELDA3_MODS_H_ -DMOD_HELPBOOK=1 -I$SDL/include/SDL2 -Dmain=SDL_main src/helpbook_os.c
    - name: 3D view unit tests compile (no ROM)
      run: |
        x86_64-w64-mingw32-gcc -O2 -Werror tests/unit/r3d_test.c src/r3d.c -o build-windows/r3d_test.exe
        x86_64-w64-mingw32-gcc -O2 -Werror tests/unit/cam3d_test.c src/cam3d.c src/r3d.c -o build-windows/cam3d_test.exe
    - name: Add the Archipelago world
      run: python3 archipelago/build_apworld.py build-windows/dist/fsotp.apworld
    - uses: actions/upload-artifact@v4
      with:
        name: zelda3-windows-${{ github.sha }}
        path: build-windows/dist/
        if-no-files-found: error

  build-switch:
    # The Nintendo Switch build: built here so it keeps building, not shipped (no artifact).
    # It carries its own set of mods (mods/switch.cfg). Untested on hardware.
    name: on Nintendo Switch (devkitPro; built, not shipped)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
    - uses: actions/checkout@v4
    - name: Build (its own mods, mods/switch.cfg)
      run: make switch -j$(nproc)

  archipelago:
    name: Archipelago client
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev
        python3 -m pip install websockets==13.1
    - name: Client against the mock server
      run: archipelago/tests/run_client_tests.sh
    - name: The APWorld packs
      run: python3 archipelago/build_apworld.py /tmp/fsotp.apworld
