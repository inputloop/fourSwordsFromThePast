name: Build

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

jobs:
  build-unix:
    name: on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          os: ubuntu-latest
        - name: Mac
          os: macos-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies for Linux
      if: ${{ matrix.name == 'Linux' }}
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev
    - name: Install dependencies for Mac
      if: ${{ matrix.name == 'Mac' }}
      run: |
        brew install sdl2 coreutils
    - name: Build
      run: make -j$(nproc) zelda3

  build-windows:
    name: on Windows (MinGW cross build)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install MinGW
      run: |
        sudo apt update
        sudo apt install -y gcc-mingw-w64-x86-64
    - name: Build
      run: tools/build_windows_mingw.sh
    - uses: actions/upload-artifact@v4
      with:
        name: zelda3-windows
        path: |
          build-windows/zelda3.exe
          build-windows/SDL2.dll
          build-windows/zelda3.ini
